[package]
name = "favorites"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "favorites"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = {version = "1.0.2", features = ["init-if-needed"]}

# LiteSVM test suite for Mutanchor. Dev-only so `cargo build-sbf`
# does not touch them.
[dev-dependencies]
anchor-lang = { version = "1.0.2", features = ["derive"] }
anchor-litesvm = "0.4.0"
solana-program = "3"
solana-sdk = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
