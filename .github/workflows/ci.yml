name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

jobs:
  build-test:
    name: Build, test, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --release

      - name: test
        run: cargo test --all

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  demo-mutation-report:
    name: Run mutator on demo program + publish report artifact
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Solana toolchain (cargo-build-sbf)
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL --retry 3 https://release.solana.com/v2.1.0/install)"
          SOL_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOL_BIN/cargo-build-sbf" ]; then
            # Locate the actual binary in case the installer used a different path.
            REAL=$(find "$HOME/.local/share/solana" -name cargo-build-sbf -type f 2>/dev/null | head -1)
            if [ -n "$REAL" ]; then
              SOL_BIN="$(dirname "$REAL")"
            else
              echo "::error::cargo-build-sbf not found after solana install"
              find "$HOME/.local/share/solana" -maxdepth 4 -iname '*build-sbf*' 2>/dev/null || true
              exit 1
            fi
          fi
          echo "cargo-build-sbf at: $SOL_BIN"
          echo "$SOL_BIN" >> "$GITHUB_PATH"
          "$SOL_BIN/cargo-build-sbf" --version || true

      - name: Verify cargo-build-sbf is reachable
        run: |
          command -v cargo-build-sbf || { echo "::error::cargo-build-sbf not on PATH"; exit 1; }
          cargo-build-sbf --version

      - name: Build demo program
        run: |
          cd demo/demo-vault
          cargo build-sbf

      - name: Run mutator (full run; truthful verdicts on CI hardware)
        run: |
          cargo run --quiet -- run demo/demo-vault --out target/mutanchor-ci --timeout 600

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: target/mutanchor-ci/

      # The run above already wrote target/mutanchor-ci/report.json with the
      # mutation score and surviving mutants; that artifact IS the deliverable.
      # No re-run or gate here — the demo program has genuine surviving
      # mutants we want to publish, and a hard gate belongs in the consumer.
      - name: Surface mutation score
        run: |
          python3 - << 'EOF'
          import json, os
          p = "target/mutanchor-ci/report.json"
          if os.path.exists(p):
              r = json.load(open(p))
              print(f"mutation score: {r['mutationScore']*100:.1f}% (killed {r['killed']}, survived {r['survived']}, build-failed {r['buildFailed']}, timeout {r['timeout']})")
          else:
              print("no report.json produced")
          EOF
