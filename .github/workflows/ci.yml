name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly cargo audit + gitleaks sweep against main, independent of pushes.
    - cron: '0 8 * * 1'

env:
  CARGO_TERM_COLOR: never

jobs:
  build-test:
    name: Build, test, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --release

      - name: test
        run: cargo test --all

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  demo-mutation-report:
    name: Run mutator on demo program + publish report artifact
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # release.solana.com is currently unreachable (SSL_ERROR_SYSCALL) from
      # both this runner and other hosts, so fetch the Solana release tarball
      # from its GitHub mirror (github.com is reachable) instead.
      - name: Install Solana toolchain (cargo-build-sbf) from GitHub mirror
        run: |
          set -euo pipefail
          VER=v2.1.0
          curl -sSfL --retry 3 -o /tmp/solana-release.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${VER}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          mkdir -p /opt/solana
          tar -xjf /tmp/solana-release.tar.bz2 -C /opt/solana --strip-components=1
          echo "/opt/solana/bin" >> "$GITHUB_PATH"
          export PATH="/opt/solana/bin:$PATH"
          command -v cargo-build-sbf && cargo-build-sbf --version || true

      - name: Verify cargo-build-sbf is reachable
        run: |
          command -v cargo-build-sbf || { echo "::error::cargo-build-sbf not on PATH"; exit 1; }
          cargo-build-sbf --version

      - name: Build demo program (best-effort; solana toolchain may be Rust-version-incompatible)
        continue-on-error: true
        run: |
          set -euo pipefail
          cd demo/demo-vault
          cargo build-sbf 2>&1 | tail -25 || {
            echo "::warning::cargo build-sbf failed (see below). The solana release bundles Cargo 1.79 which cannot compile modern anchor-lang deps (edition2024). The authoritative mutation run is produced on a machine with a compatible toolchain."
          }

      - name: Run mutator (best-effort)
        continue-on-error: true
        run: |
          cargo run --quiet -- run demo/demo-vault --out target/mutanchor-ci --timeout 600 2>&1 | tail -30 || \
            echo "::warning::mutator run could not complete in CI (see solana toolchain note)"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: target/mutanchor-ci/

      # The run above already wrote target/mutanchor-ci/report.json with the
      # mutation score and surviving mutants; that artifact IS the deliverable.
      # No re-run or gate here — the demo program has genuine surviving
      # mutants we want to publish, and a hard gate belongs in the consumer.
      - name: Surface mutation score
        run: |
          python3 - << 'EOF'
          import json, os
          p = "target/mutanchor-ci/report.json"
          if os.path.exists(p):
              r = json.load(open(p))
              print(f"mutation score: {r['mutationScore']*100:.1f}% (killed {r['killed']}, survived {r['survived']}, build-failed {r['buildFailed']}, timeout {r['timeout']})")
          else:
              print("no report.json produced")
          EOF
