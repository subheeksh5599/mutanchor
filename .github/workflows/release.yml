name: Release

# Two triggers:
#   - Manual dispatch: verify `cargo publish --dry-run` succeeds. Never publishes.
#   - Tag push (v*):   run the full check, then publish to crates.io if the
#                      CARGO_REGISTRY_TOKEN secret is set. Absent the secret,
#                      the job stops after the dry-run — no accidental publish.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: never

jobs:
  publish-check:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify version metadata is present
        run: |
          grep -E '^(repository|homepage|readme|license|keywords|categories)\s*=' Cargo.toml \
            | tee /tmp/meta.txt
          for field in repository homepage readme license; do
            grep -q "^${field}" /tmp/meta.txt || { echo "::error::missing Cargo.toml field: ${field}"; exit 1; }
          done

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --allow-dirty

      - name: cargo publish (tag push only, if token present)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping real publish."
            exit 0
          fi
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
