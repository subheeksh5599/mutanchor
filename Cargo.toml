[package]
name = "mutanchor"
version = "0.1.0"
edition = "2021"
description = "Mutation testing for Solana Anchor programs: break your source on purpose, run the suite on LiteSVM, and see which bugs your tests would miss."
license = "MIT"
rust-version = "1.75"
readme = "README.md"
repository = "https://github.com/subheeksh5599/mutanchor"
homepage = "https://mutanchor.vercel.app"
keywords = ["solana", "anchor", "mutation-testing", "testing", "litesvm"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "0.8"
anyhow = "1"
regex-lite = "0.1"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = "thin"
